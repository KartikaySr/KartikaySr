<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Kartikay Srivastava — Backend Systems, Data Infrastructure and Applied AI</title>
  <desc id="desc">An Omnitrix-inspired black, green, silver and gold interface for Kartikay Srivastava.</desc>
  <defs>
